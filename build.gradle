plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = '1.0.0'
group = 'com.cobbledex'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    server {
        jvmArgs '--add-modules', 'jdk.httpserver'
        programArgument '--nogui'
    }
}

repositories {
    maven {
        name = 'Cobblemon'
        url = 'https://maven.cobblemon.dev/releases'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.226"
    // VERIFY: exact artifact ID at https://maven.cobblemon.dev/releases/com/cobblemon/
    compileOnly "com.cobblemon:mod-neoforge:1.7.3+1.21.1"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : '1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        neo_version            : '21.1.226',
        neo_version_range      : '[21.1,)',
        loader_version_range   : '[4,)',
        mod_id                 : 'cobbledex',
        mod_name               : 'CobbleDex',
        mod_version            : project.version,
        mod_description        : 'Local Pokedex website for Cobblemon multiplayer servers'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
