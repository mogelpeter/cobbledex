<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobbleDex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">
</head>
<body>
  <header>
    <div class="logo-pill">
      <img class="logo-pill-icon"
           src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
           alt="CobbleDex">
      <h1>CobbleDex</h1>
    </div>
  </header>
  <nav id="player-tabs"></nav>
  <main>
    <div class="controls-bar">
      <div id="view-tabs">
        <button id="tab-dex"    class="view-tab active">Cobbledex</button>
        <button id="tab-team"   class="view-tab">Team</button>
        <button id="tab-wanted" class="view-tab">Wanted</button>
      </div>
      <div class="search-wrapper">
        <input id="search-input" type="text" placeholder="Cobblemon suchen…" autocomplete="off">
      </div>
      <div id="sort-controls">
        <label class="sort-label" for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="dex">Dex #</option>
          <option value="name">Name</option>
          <option value="status">Status</option>
        </select>
      </div>
    </div>
    <div id="dex-stats"></div>
    <div id="type-filter" class="type-filter-row"></div>
    <div id="dex-grid"></div>
    <div id="team-view"></div>
    <div id="wanted-view" style="display:none"></div>
  </main>

  <div id="modal" class="hidden">
    <div id="modal-backdrop"></div>
    <div id="modal-box">
      <div id="modal-title"></div>
      <div id="modal-cards"></div>
      <button id="modal-close">× Close</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
