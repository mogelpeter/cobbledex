plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = '1.0.8'
group = 'com.cobbledex'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}


// Separate configuration for pure unit tests — NeoForge never touches this.
configurations {
    pureUnitTest
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.226"
    // Cobblemon JAR from the installed modpack — provided at runtime, compile-only here
    compileOnly files("C:/Users/lyx/curseforge/minecraft/Instances/All the Mons - ATMons/mods/Cobblemon-neoforge-1.7.3+1.21.1.jar")
    // Kotlin stdlib needed to resolve KMappedMarker on Cobblemon's Kotlin classes at compile time.
    // Cobblemon doesn't bundle Kotlin — use the copy already present in the Gradle distribution.
    compileOnly fileTree(dir: "${gradle.gradleHomeDir}/lib", include: 'kotlin-stdlib-*.jar')
    testImplementation platform("org.junit:junit-bom:5.10.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Same JUnit artifacts on the isolated configuration
    pureUnitTest platform("org.junit:junit-bom:5.10.3")
    pureUnitTest "org.junit.jupiter:junit-jupiter"
    pureUnitTest "org.junit.platform:junit-platform-launcher"
    // Log4j 2 API + simple no-op core so LogManager.getLogger() resolves at test time.
    // Version matches what NeoForge pulls in at runtime.
    pureUnitTest "org.apache.logging.log4j:log4j-api:2.22.1"
    pureUnitTest "org.apache.logging.log4j:log4j-core:2.22.1"
    // Gson is bundled inside NeoForge at runtime but not available on the isolated
    // pureUnitTest classpath — add it explicitly so DiscordWebhookService can initialise.
    pureUnitTest "com.google.code.gson:gson:2.10.1"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : '1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        neo_version            : '21.1.226',
        neo_version_range      : '[21.1,)',
        loader_version_range   : '[4,)',
        mod_id                 : 'cobbledex',
        mod_name               : 'CobbleDex',
        mod_version            : project.version,
        mod_description        : 'Local Pokedex website for Cobblemon multiplayer servers'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Separate unit test task that bypasses NeoForge's Minecraft test runner.
// NeoForge registers JUnitService as a LauncherSessionListener via ServiceLoader;
// it crashes on startup looking for mainargs.txt. Use a completely isolated
// configuration (pureUnitTest) so NeoForge never touches the classpath.
// Use: .\gradlew.bat unitTest
tasks.register('unitTest', Test) {
    description = 'Runs unit tests without launching Minecraft.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = configurations.pureUnitTest + sourceSets.main.output + sourceSets.test.output
}
